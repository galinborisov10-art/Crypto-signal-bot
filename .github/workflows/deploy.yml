name: Auto-Deploy to Digital Ocean

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'  # 04:00 Bulgarian time (UTC+2)
  workflow_dispatch:  # Ръчно пускане

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
      
      - name: Deploy to Digital Ocean
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@${{ secrets.SERVER_IP }} << 'EOF'
            cd /root/Crypto-signal-bot
            
            echo "📥 Syncing with GitHub repository..."
            
            # Initialize git if not already done
            if [ ! -d .git ]; then
              git init
              git remote add origin https://github.com/galinborisov10-art/Crypto-signal-bot.git
            fi
            
            # Запази restart flag ако съществува
            if [ -f .restart_requested ]; then
              cp .restart_requested /tmp/.restart_requested_backup
              echo "💾 Restart flag запазен временно"
            fi
            
            # Reset any local changes and pull latest
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            
            # Възстанови restart flag
            if [ -f /tmp/.restart_requested_backup ]; then
              mv /tmp/.restart_requested_backup .restart_requested
              echo "♻️ Restart flag възстановен"
            fi
            
            echo "✅ All files updated from GitHub!"
            
            # Изтрий Python cache файлове (критично!)
            echo "🗑️ Изтриване на Python cache..."
            find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
            find . -type f -name "*.pyc" -delete 2>/dev/null || true
            find . -type f -name "*.pyo" -delete 2>/dev/null || true
            echo "✅ Python cache изчистен"
            
            # Генерирай deployment info
            echo "📋 Създаване на deployment info..."
            COMMIT_SHA=$(git rev-parse --short HEAD)
            VERSION=$(cat VERSION || echo "2.0")
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            
            # Get PTB version (check if venv exists)
            if [ -f venv/bin/activate ]; then
              PTB_VERSION=$(source venv/bin/activate && python3 -m pip show python-telegram-bot 2>/dev/null | grep Version | awk '{print $2}')
            else
              PTB_VERSION=$(python3 -m pip show python-telegram-bot 2>/dev/null | grep Version | awk '{print $2}')
            fi
            PTB_VERSION=${PTB_VERSION:-"unknown"}
            
            # Create deployment info JSON using printf for safer string handling
            printf '{\n  "version": "%s",\n  "last_deployed": "%s",\n  "commit_sha": "%s",\n  "deployed_from": "github-actions",\n  "python_telegram_bot_version": "%s"\n}\n' \
              "$VERSION" "$TIMESTAMP" "$COMMIT_SHA" "$PTB_VERSION" > .deployment-info
            
            echo "📋 Deployment Info:"
            cat .deployment-info
            
            # Update systemd service file if it exists in repo
            if [ -f crypto-signal-bot.service ]; then
              echo "🔧 Updating systemd service file..."
              cp crypto-signal-bot.service /etc/systemd/system/crypto-signal-bot.service
              echo "✅ Service file updated"
            fi
            
            echo "🔄 Stopping bot service..."
            systemctl stop crypto-signal-bot || true
            
            # Kill any remaining Python processes running bot.py (force cleanup)
            echo "🧹 Cleaning up any remaining bot processes..."
            pkill -9 -f "python.*bot.py" || true
            sleep 2
            
            # Verify no bot processes remain
            if pgrep -f "python.*bot.py" > /dev/null; then
              echo "⚠️ WARNING: Bot processes still running, forcing kill again..."
              pkill -9 -f "python.*bot.py" || true
              sleep 1
            fi
            
            echo "✅ All bot processes terminated"
            
            # Reload systemd to pick up any service file changes
            echo "🔧 Reloading systemd daemon..."
            systemctl daemon-reload
            
            echo "🚀 Starting bot service..."
            systemctl start crypto-signal-bot
            
            # Wait for service to start
            sleep 5
            
            # Run health check
            echo "🔍 Running health check..."
            if [ -f health-check.sh ]; then
              chmod +x health-check.sh
              ./health-check.sh
            fi
            
            # Check if bot is running
            if systemctl is-active --quiet crypto-signal-bot; then
              echo "✅ Bot service is active"
              
              # Verify the bot process is actually running with new code
              BOT_PID=$(pgrep -f "python.*bot.py" | head -1)
              if [ -n "$BOT_PID" ]; then
                BOT_START_TIME=$(ps -p $BOT_PID -o lstart=)
                echo "✅ Bot process PID: $BOT_PID"
                echo "✅ Bot started at: $BOT_START_TIME"
                echo "✅ Deploy complete! Bot is running with fresh code."
              else
                echo "⚠️ WARNING: Bot service is active but no bot.py process found!"
                exit 1
              fi
            else
              echo "❌ WARNING: Bot service is not active!"
              systemctl status crypto-signal-bot --no-pager
              exit 1
            fi
          EOF
      
      - name: Get Deployment Info
        id: deploy_info
        run: |
          VERSION=$(ssh -i ~/.ssh/deploy_key root@${{ secrets.SERVER_IP }} "cat /root/Crypto-signal-bot/VERSION 2>/dev/null || echo '2.0'")
          COMMIT_SHA=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
      
      - name: Send Success Notification
        if: success()
        run: |
          VERSION="${{ steps.deploy_info.outputs.version }}"
          COMMIT_SHA="${{ steps.deploy_info.outputs.commit_sha }}"
          
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MESSAGE="🌅 ДНЕВЕН AUTO-DEPLOY ЗАВЪРШЕН!%0A%0A📦 Версия: v${VERSION}%0A🔖 Commit: ${COMMIT_SHA}%0A✅ Файловете са обновени%0A✅ Ботът е рестартиран успешно%0A✅ ML модели са запазени%0A✅ Python cache изчистен%0A%0A⏰ $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          else
            MESSAGE="🚀 DEPLOY ЗАВЪРШЕН УСПЕШНО!%0A%0A📦 Версия: v${VERSION}%0A🔖 Commit: ${COMMIT_SHA}%0A✅ Файловете са обновени от GitHub%0A✅ Ботът е рестартиран и работи%0A✅ Python cache изчистен%0A%0A⏰ $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          fi
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=${MESSAGE}" \
            -d "disable_notification=false" || echo "Telegram notification failed but deploy succeeded"
      
      - name: Send Failure Notification
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "disable_notification=false" \
            -d "text=❌ AUTO-DEPLOY НЕУСПЕШЕН!%0A%0AПровери GitHub Actions логовете:%0Ahttps://github.com/galinborisov10-art/Crypto-signal-bot/actions"
